name: Daily Blog Auto-Publisher & Keep-Alive

on:
  schedule:
    # Publishes 5 articles every single day automatically in GitHub Actions Cloud:
    # 1. 02:00 UTC (07:30 AM IST) - Morning Post
    # 2. 06:00 UTC (11:30 AM IST) - Midday Post
    # 3. 10:00 UTC (03:30 PM IST) - Afternoon Post
    # 4. 14:00 UTC (07:30 PM IST) - Evening Post
    # 5. 18:00 UTC (11:30 PM IST) - Night Post
    - cron: '0 2,6,10,14,18 * * *'
  workflow_dispatch:
    inputs:
      count:
        description: 'Number of blogs to publish in this run (e.g. 1 or 5)'
        required: false
        default: '1'

jobs:
  publish-daily-blog:
    name: Generate Post, Update Supabase & Push Sitemap
    runs-on: ubuntu-latest
    permissions:
      contents: write # Allows committing the updated sitemap to GitHub

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Publish New Blog Post to Supabase
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/daily-blog-generator.js ${{ github.event.inputs.count || '1' }}

      - name: Regenerate Sitemap
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: node scripts/generate-sitemap.js

      - name: Commit and Push Updated Sitemap
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/sitemap.xml
          if git diff --staged --quiet; then
            echo "No sitemap changes to commit."
          else
            git commit -m "chore(seo): update sitemap.xml with daily published blog post [skip ci]"
            git push
            echo "Successfully pushed updated sitemap to GitHub."
          fi
