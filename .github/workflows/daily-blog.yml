name: Daily Blog Auto-Publisher & Keep-Alive

on:
  schedule:
    # Runs 4 times a day (every 6 hours) automatically in GitHub Cloud
    # 02:00 UTC (07:30 AM IST) - Morning Article
    # 08:00 UTC (01:30 PM IST) - Afternoon Article
    # 14:00 UTC (07:30 PM IST) - Evening Article
    # 20:00 UTC (01:30 AM IST) - Night Article
    - cron: '0 2,8,14,20 * * *'
  workflow_dispatch: # Allows manual one-click trigger from GitHub Actions tab anytime

jobs:
  publish-daily-blog:
    name: Generate Post, Update Supabase & Push Sitemap
    runs-on: ubuntu-latest
    permissions:
      contents: write # Allows committing the updated sitemap to GitHub

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Publish New Blog Post to Supabase
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/daily-blog-generator.js

      - name: Regenerate Sitemap
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: node scripts/generate-sitemap.js

      - name: Commit and Push Updated Sitemap
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/sitemap.xml
          if git diff --staged --quiet; then
            echo "No sitemap changes to commit."
          else
            git commit -m "chore(seo): update sitemap.xml with daily published blog post [skip ci]"
            git push
            echo "Successfully pushed updated sitemap to GitHub."
          fi
